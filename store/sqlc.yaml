version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "store"
        out: "."
        sql_package: "pgx/v5"
        emit_result_struct_pointers: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type: "string"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
