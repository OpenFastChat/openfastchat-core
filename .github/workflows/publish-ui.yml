name: Publish @openfastchat/ui

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm -C frontend install --frozen-lockfile

      # prepack re-syncs compactPrompt.md from the canonical Go source, then
      # publishes the self-contained package. --no-git-checks: tag builds run
      # in detached HEAD.
      - name: Publish
        run: pnpm -C frontend publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
